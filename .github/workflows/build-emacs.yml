name: Build Emacs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        default: 'main'
  schedule:
    - cron: '0 0 * * 0'   # weekly, Sundays at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scheduled runs do not reset GitHub's repository inactivity timer.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/${GH_REPO}/actions/workflows/build-emacs.yml/enable"

  build-ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Decide whether to run scheduled build (biweekly gate)
        if: github.event_name == 'schedule'
        id: biweek
        run: |
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: github.event_name != 'schedule' || steps.biweek.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up environment
        if: github.event_name != 'schedule' || steps.biweek.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.biweek.outputs.run == 'true'
        run: ./build-emacs.sh -s install_deps -y

      - name: Build Emacs
        if: github.event_name != 'schedule' || steps.biweek.outputs.run == 'true'
        run: ./build-emacs.sh -g -s kill_emacs,remove_emacs,pull_emacs,build_emacs,install_emacs,fix_emacs_xwidgets,copy_emacs_icon -y
